name: "Write IDL Buffer"
description: "Creates a buffer for the program IDL"
inputs:
  program-id:
    description: "Program ID"
    required: true
  program:
    description: "Program name"
    required: true
  rpc-url:
    description: "Solana RPC URL"
    required: true
  keypair:
    description: "The keypair to use for buffer creation"
    required: true
  idl-authority:
    description: "The address of the idl buffer authority"
    required: true

outputs:
  buffer:
    description: "Created IDL buffer address"
    value: ${{ steps.write-buffer.outputs.buffer }}

runs:
  using: "composite"
  steps:
    - name: Write keypair
      shell: bash
      run: echo "$DEPLOY_KEYPAIR" > ./deploy-keypair.json && chmod 600 ./deploy-keypair.json
      env:
        DEPLOY_KEYPAIR: ${{ inputs.keypair }}

    - name: Check if IDL exists
      id: check-idl
      shell: bash
      run: |
        if anchor idl fetch ${{ inputs.program-id }} --provider.cluster ${{ inputs.rpc-url }} > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Write IDL buffer
      id: write-buffer
      if: steps.check-idl.outputs.exists == 'true'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        shell: bash
        command: |
          # Write buffer with retries
          for i in {1..5}; do
            echo "Attempt $i to write IDL buffer..."
            sleep $((i * 2))
            
            anchor idl write-buffer ${{ inputs.program-id }} \
              --filepath ./target/idl/${{ inputs.program }}.json \
              --provider.cluster ${{ inputs.rpc-url }} \
              --priority-fee 100000 \
              --provider.wallet ./deploy-keypair.json > buffer.out

            BUFFER=$(cat buffer.out | grep -o 'Idl buffer created: [^ ]*' | cut -d' ' -f4)
            if [ ! -z "$BUFFER" ]; then
              echo "buffer=$BUFFER" >> $GITHUB_OUTPUT
              break
            fi
          done

          if [ -z "$BUFFER" ]; then
            echo "Failed to create IDL buffer after 5 attempts"
            exit 1
          fi

    - name: Prefund IDL account rent
      if: steps.write-buffer.outputs.buffer != ''
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        shell: bash
        command: |
          set -euo pipefail
          BUFFER="${{ steps.write-buffer.outputs.buffer }}"
          RPC="${{ inputs.rpc-url }}"
          echo "Pre-funding Anchor IDL account rent from deployer (so Squads needs no vault SOL top-up)..."

          IDL_ADDR=$(PROGRAM_ID="${{ inputs.program-id }}" \
            npx --yes -p @solana/web3.js@1.98.2 \
            node --input-type=module -e '
              import { PublicKey } from "@solana/web3.js";
              const programId = new PublicKey(process.env.PROGRAM_ID);
              const [base] = PublicKey.findProgramAddressSync([], programId);
              const idl = await PublicKey.createWithSeed(base, "anchor:idl", programId);
              process.stdout.write(idl.toBase58());
            ')
          if [ -z "$IDL_ADDR" ]; then
            echo "Error: failed to derive Anchor IDL address"
            exit 1
          fi

          BUFFER_LEN=$(solana account "$BUFFER" -u "$RPC" --output json | jq -r '.account.space')
          if ! [[ "$BUFFER_LEN" =~ ^[0-9]+$ ]]; then
            echo "Error: could not read IDL buffer account size for $BUFFER (got: $BUFFER_LEN)"
            exit 1
          fi

          REQUIRED=$(solana rent "$BUFFER_LEN" --lamports -u "$RPC" | grep -oE '[0-9]+' | head -1)
          if ! [[ "$REQUIRED" =~ ^[0-9]+$ ]]; then
            echo "Error: could not calculate rent for $BUFFER_LEN bytes (got: $REQUIRED)"
            exit 1
          fi

          CURRENT=$(solana balance "$IDL_ADDR" -u "$RPC" --lamports 2>/dev/null | awk '{print $1}' || true)
          CURRENT=${CURRENT:-0}
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
            CURRENT=0
          fi
          SHORTFALL=$((REQUIRED - CURRENT))

          echo "IDL account: $IDL_ADDR"
          echo "Target size: $BUFFER_LEN bytes, required: $REQUIRED, current: $CURRENT, shortfall: $SHORTFALL"

          if [ "$SHORTFALL" -le 0 ]; then
            echo "Account already has enough lamports; skipping transfer"
            exit 0
          fi

          AMOUNT_SOL=$(awk "BEGIN { printf \"%.9f\", $SHORTFALL / 1000000000 }")
          solana transfer "$IDL_ADDR" "$AMOUNT_SOL" \
            --from ./deploy-keypair.json \
            --keypair ./deploy-keypair.json \
            --url "$RPC" \
            --allow-unfunded-recipient
          echo "Pre-funded $SHORTFALL lamports ($AMOUNT_SOL SOL) -> $IDL_ADDR"

    - name: Set Buffer Authority
      if: steps.write-buffer.outputs.buffer != ''
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        shell: bash
        command: |
          echo "Setting buffer authority..."
          anchor idl set-authority ${{ steps.write-buffer.outputs.buffer }} \
            --program-id ${{ inputs.program-id }} \
            --new-authority ${{ inputs.idl-authority }} \
            --provider.cluster ${{ inputs.rpc-url }} \
            --priority-fee 100000 \
            --provider.wallet ./deploy-keypair.json

    - name: Set Program IDL Authority
      if: steps.write-buffer.outputs.buffer != ''
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 5
        max_attempts: 3
        shell: bash
        command: |
          echo "Setting program IDL authority..."
          anchor idl set-authority \
            --program-id ${{ inputs.program-id }} \
            --new-authority ${{ inputs.idl-authority }} \
            --provider.cluster ${{ inputs.rpc-url }} \
            --priority-fee 100000 \
            --provider.wallet ./deploy-keypair.json || echo "Failed to set program IDL authority (this is ok if the authority is already set to squads for example)"

    - name: Cleanup
      if: always()
      shell: bash
      run: rm -f ./deploy-keypair.json
